name: Build and publish container image

# Builds the app image and pushes it to the GitHub Container Registry (GHCR):
#   ghcr.io/<owner>/mailmatrixai
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # e.g. cs4p/MailMatrixAI (lowercased below)

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Always build for tags (that's where semver images come from) and for PRs.
    # For a branch push, skip the automated version-bump commit — the merge that
    # preceded it already built the latest/main/sha images for identical code.
    if: ${{ github.ref_type == 'tag' || !contains(github.event.head_commit.message, '[skip version]') }}
    permissions:
      contents: read
      packages: write        # required to push to GHCR
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Repository names can contain uppercase; GHCR paths must be lowercase.
      - name: Compute lowercase image name
        id: img
        run: echo "name=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Only log in / push for real refs — pull_request builds validate the
      # Dockerfile without needing registry write access.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
