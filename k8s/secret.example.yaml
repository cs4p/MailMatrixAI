# Copy to secret.yaml and fill in real values, then `kubectl apply -f secret.yaml`.
# secret.yaml is git-ignored — do NOT commit real credentials.
#
# In the container there is no macOS Keychain, so the app reads these from the
# environment (commonFunctions.get_credential falls back to os.environ).
apiVersion: v1
kind: Secret
metadata:
  name: mailmatrixai-credentials
  labels:
    app: mailmatrixai
type: Opaque
stringData:
  IMAP_SERVER: imap.fastmail.com
  IMAP_PORT: "993"
  IMAP_USERNAME: you@example.com
  IMAP_PASSWORD: your_fastmail_app_password
  SMTP_SERVER: smtp.fastmail.com
  SMTP_PORT: "465"
  ANTHROPIC_API_KEY: sk-ant-your-key
