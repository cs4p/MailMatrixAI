[project]
name = "mailmatrixai"
version = "0.4.7"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.2.2",
    "anthropic>=0.50.0",
    "flask>=3.0",
    "keyring>=25.0",
]

[project.optional-dependencies]
dev = ["pytest>=9.0.3", "httpx>=0.27"]

[tool.setuptools]
py-modules = ["app", "commonFunctions", "emailRulesInit", "sortEmail", "resortEmail", "emailSummary", "cleanupRules"]

[tool.pytest.ini_options]
testpaths = ["tests"]
